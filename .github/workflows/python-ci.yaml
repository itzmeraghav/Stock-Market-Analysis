name: Backend CI Pipeline

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

env:
  PYTHON_VERSION: "3.11"

jobs:

  # --------------------------------
  # Code Quality + Test
  # --------------------------------
  build-test:
    name: Build, Lint and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Ruff Format Check
        run: ruff format --check .

      - name: Ruff Lint Check
        run: ruff check .

      - name: Create test .env file
        working-directory: backend
        run: |
           cat > .env << EOF
           DATABASE_URL=sqlite:///:memory:
           APP_NAME=stockmarketanalytics-test
           DEBUG=true
           JWT_SECRET_KEY=test-secret-key-not-for-prod
           JWT_ALGORITHM=HS256
           ACCESS_TOKEN_EXPIRE_MINUTES=30
           REFRESH_TOKEN_EXPIRE_DAYS=7
           LOGIN_RATE_LIMIT_PER_IP=5/minute
           LOGIN_MAX_FAILED_ATTEMPTS=5
           LOGIN_LOCKOUT_MINUTES=15
           REFRESH_MIN_INTERVAL_SECONDS=30
           TOKEN_GLOBAL_CAP_PER_HOUR=1000/hour
           RATE_LIMIT_AUTHENTICATED=100/minute
           RATE_LIMIT_UNAUTHENTICATED=20/minute
           EOF
        
      - name: Run Pytest
        working-directory: backend
        env:
          PYTHONPATH: ${{ github.workspace }}/backend/src
          DATABASE_URL: "sqlite:///:memory:"
          APP_NAME: "stockmarketanalytics-test"
          DEBUG: "true"
          JWT_SECRET_KEY: "test-secret-key-not-for-prod"
          JWT_ALGORITHM: "HS256"
          ACCESS_TOKEN_EXPIRE_MINUTES: "15"
          REFRESH_TOKEN_EXPIRE_DAYS: "7"
          LOGIN_RATE_LIMIT_PER_IP: "5/minute"
          LOGIN_MAX_FAILED_ATTEMPTS: "5"
          LOGIN_LOCKOUT_MINUTES: "15"
          REFRESH_MIN_INTERVAL_SECONDS: "30"
          TOKEN_GLOBAL_CAP_PER_HOUR: "1000/hour"
          RATE_LIMIT_AUTHENTICATED: "100/minute"
          RATE_LIMIT_UNAUTHENTICATED: "20/minute"
        run: |
          pytest --cov=. --cov-report=xml --cov-report=term --cov-fail-under=85
          
  # --------------------------------
  # Dependency Security Scan
  # --------------------------------
  security:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run Security Scan
        run: pip-audit -r requirements.txt

  # --------------------------------
  # SonarQube Code Quality
  # --------------------------------
  codacy:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: security
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Analysis
        uses: SonarSource/sonarqube-scan-action@v7
        with:
          project-token: ${{ secrets.SONAR_TOKEN }}
