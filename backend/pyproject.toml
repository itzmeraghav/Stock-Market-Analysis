[project]
name = "stockmarketanalytics"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "goutam-tech", email = "goutamgotur2006@outlook.com" },
    { name = "itzmeraghav", email = "raaghavindhra@gmail.com" },
    { name = "chetankumar72", email = "ck434120@gmail.com" }
]

requires-python = ">=3.11"
dependencies = [
    "alembic",
    "black>=26.5.1",
    "fastapi>=0.141.1",
    "httpx",
    "joblib>=1.5.3",
    "lightgbm>=4.7.0",
    "mypy>=2.3.1",
    "numpy",
    "pandas",
    "pip-audit>=2.10.1",
    "pydantic-settings",
    "pymysql>=1.2.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "python-multipart",
    "ruff>=0.16.4",
    "scikit-learn",
    "scipy",
    "sqlalchemy",
    "uvicorn[standard]",
    "yfinance>=1.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stockmarketanalytics"]

[project.scripts]
stock_backend = "stockmarket.main:app"