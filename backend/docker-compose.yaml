version: "3.9"

services:

  backend:
    build: .
    image: docker.io/stock_backend_backend
    container_name: stock_backend

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      - PYTHONPATH=/app/src

    extra_hosts:
      - "host.containers.internal:host-gateway"

    volumes:
      - .:/app